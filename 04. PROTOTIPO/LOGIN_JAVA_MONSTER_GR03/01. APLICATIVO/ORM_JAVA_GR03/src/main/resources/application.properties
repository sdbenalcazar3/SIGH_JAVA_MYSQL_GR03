spring.application.name=ORM_JAVA_GR03
server.port=${SERVER_PORT:8090}
spring.datasource.url=${SIGH_DB_URL:jdbc:mariadb://127.0.0.1:3307/SIGH_GR3?allowPublicKeyRetrieval=true}
spring.datasource.username=${SIGH_DB_USER:root}
spring.datasource.password=${SIGH_DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.community.dialect.MariaDBLegacyDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SIGH_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
server.error.include-message=never

# ---------- Login ----------
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
server.servlet.session.timeout=20m
server.servlet.session.cookie.http-only=true
server.servlet.session.tracking-modes=cookie
# Datos que se preparan al iniciar (tabla de tokens, clave inicial y opcion DEP)
login.datos-iniciales=${LOGIN_DATOS_INICIALES:true}
login.clave-inicial=${LOGIN_CLAVE_INICIAL:Sigh2026}

# ---------- Correo para recuperar la clave ----------
# Sin MAIL_USERNAME el enlace de recuperacion se muestra en la consola de NetBeans.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
